<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#17191c"><title>Lobby • Xadrez</title><style>:root{--bg:#17191c;--panel:#25282d;--accent:#4aa3ff;--text:#f7f8fa;--muted:#aab1bb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.app{width:min(100%,620px);margin:auto;padding:18px 12px}.brand{text-align:center;letter-spacing:2px}.card{background:var(--panel);border-radius:16px;padding:18px;margin:12px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{border:0;border-radius:10px;padding:11px 15px;background:#3a3f46;color:#fff;font-weight:800;text-decoration:none;cursor:pointer}.primary{background:var(--accent)}.muted{color:var(--muted)}.room{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid #ffffff12}.room:first-child{border:0}.code{font:900 18px monospace;letter-spacing:2px}.badge{font-size:12px;background:#203b2d;color:#80e4aa;border-radius:20px;padding:5px 8px}.empty{text-align:center;padding:30px 10px}.dot{display:inline-block;width:8px;height:8px;background:#55c989;border-radius:50%;margin-right:6px}.refresh{font-size:13px;text-align:center;color:var(--muted);margin-top:12px}</style></head><body><main class="app"><h1 class="brand">XADREZ</h1><div class="top"><div><h2 style="margin:0">Lobby</h2><span class="muted"><span class="dot"></span>Salas abertas agora</span></div><a class="btn" href="./">Início</a></div><section class="card"><div id="rooms"><div class="empty muted">Carregando salas…</div></div><div id="refresh" class="refresh"></div></section><div style="text-align:center"><a class="btn primary" href="./">CRIAR NOVA PARTIDA</a></div></main><script>const W='https://xadrez-realtime.alex-cerpe.workers.dev';async function load(){try{const r=await fetch(W+'/lobby',{cache:'no-store'}),rooms=await r.json(),open=rooms.filter(x=>x.status==='waiting'&&x.players<2);document.querySelector('#rooms').innerHTML=open.length?open.map(x=>`<div class="room"><div><div class="code">${x.room}</div><div class="muted">${x.minutes} min • ${x.players}/2 jogador${x.players===1?'':'es'}</div></div><a class="btn primary" href="./?room=${encodeURIComponent(x.room)}">ENTRAR</a></div>`).join(''):'<div class="empty"><b>Nenhuma sala aguardando jogador</b><p class="muted">Crie uma partida e ela aparecerá aqui automaticamente.</p></div>';document.querySelector('#refresh').textContent='Atualização automática a cada 3 segundos'}catch(e){document.querySelector('#rooms').innerHTML='<div class="empty">Não foi possível carregar o lobby.<p class="muted">Tentando novamente…</p></div>'}}load();setInterval(load,3000)</script></body></html>
