<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Xadrez Online</title>
<style>
:root{--bg:#1d1f22;--panel:#292c31;--light:#e6d5b8;--dark:#8a6548;--accent:#4aa3ff;--text:#f6f7f8;--muted:#aeb4bd;--danger:#e35d6a}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;touch-action:manipulation}body{display:flex;justify-content:center}.app{width:min(100%,620px);padding:18px 12px 28px}h1{text-align:center;margin:4px 0 14px;font-size:30px}.card{background:var(--panel);border-radius:16px;padding:18px;box-shadow:0 12px 30px #0005}.hidden{display:none!important}.start{text-align:center}.start h2{margin-top:0}.times,.actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:12px 18px;background:#3b4047;color:white;font-weight:800;font-size:16px;cursor:pointer}.btn.active,.btn.primary{background:var(--accent)}.btn:disabled{opacity:.45;cursor:not-allowed}.room{font-size:13px;color:var(--muted);margin-top:12px;word-break:break-all}.status{text-align:center;font-weight:800;margin:10px 0 12px;min-height:20px}.player{display:flex;align-items:center;justify-content:space-between;background:var(--panel);padding:10px 14px;border-radius:12px;margin:8px 0}.player.active{outline:2px solid var(--accent)}.clock{font:900 30px/1 monospace;font-variant-numeric:tabular-nums}.board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);border-radius:8px;overflow:hidden;box-shadow:0 10px 30px #0007;user-select:none}.sq{display:grid;place-items:center;position:relative;font-size:clamp(30px,10vw,60px);cursor:pointer}.sq.light{background:var(--light)}.sq.dark{background:var(--dark)}.sq.selected{box-shadow:inset 0 0 0 5px #45a7ff}.sq.legal:after{content:"";width:22%;aspect-ratio:1;border-radius:50%;background:#1118;position:absolute}.sq.capture:after{content:"";position:absolute;inset:5%;border:5px solid #1117;border-radius:50%}.sq.last{box-shadow:inset 0 0 0 999px #f6e45c45}.piece{z-index:2;line-height:1;text-shadow:0 2px 2px #0004}.whitePiece{color:#fff;text-shadow:0 1px 2px #000,0 0 1px #000}.blackPiece{color:#111}.footer{display:flex;gap:8px;margin-top:12px;justify-content:center}.promo{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:20}.promoBox{background:var(--panel);padding:18px;border-radius:14px;text-align:center}.promoChoices{display:flex;gap:8px;margin-top:12px}.promoChoices button{font-size:42px;width:64px;height:64px}.small{font-size:13px;color:var(--muted)}
</style>
</head><body><main class="app">
<h1>XADREZ</h1>
<section id="start" class="card start"><h2>Nova partida</h2><p>Escolha o tempo e crie a sala.</p><div class="times"><button class="btn time" data-min="3">3 min</button><button class="btn time active" data-min="5">5 min</button><button class="btn time" data-min="10">10 min</button></div><div class="actions" style="margin-top:14px"><button id="create" class="btn primary">Player 1 — Criar</button><button id="join" class="btn">Player 2 — Entrar</button></div><div id="joinBox" class="hidden" style="margin-top:12px"><input id="roomInput" placeholder="Código da sala" maxlength="8" style="padding:12px;border-radius:9px;border:0;text-transform:uppercase"><button id="joinGo" class="btn primary">Entrar</button></div><div id="startMsg" class="room"></div></section>
<section id="game" class="hidden"><div id="opponent" class="player"><span>Adversário</span><span id="oppClock" class="clock">05:00</span></div><div id="status" class="status">Conectando…</div><div id="board" class="board"></div><div id="me" class="player"><span>Você</span><span id="myClock" class="clock">05:00</span></div><div class="footer"><button id="copy" class="btn">Copiar convite</button><button id="resign" class="btn">Desistir</button></div><p id="roomInfo" class="small" style="text-align:center"></p></section>
<div id="promo" class="promo hidden"><div class="promoBox"><b>Promover peão para:</b><div id="promoChoices" class="promoChoices"></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
const WORKER_URL='https://xadrez-realtime.alex-cerpe.workers.dev';
const $=s=>document.querySelector(s);let mins=5,ws=null,role=null,color=null,room=null,game=new Chess(),selected=null,legal=[],lastMove=null,pendingPromotion=null,state=null;
const glyph={w:{k:'♔',q:'♕',r:'♖',b:'♗',n:'♘',p:'♙'},b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}};
document.querySelectorAll('.time').forEach(b=>b.onclick=()=>{mins=+b.dataset.min;document.querySelectorAll('.time').forEach(x=>x.classList.toggle('active',x===b))});
$('#create').onclick=()=>connect('create');$('#join').onclick=()=>$('#joinBox').classList.remove('hidden');$('#joinGo').onclick=()=>{room=$('#roomInput').value.trim().toUpperCase();if(room)connect('join')};
const qp=new URLSearchParams(location.search);if(qp.get('room')){$('#joinBox').classList.remove('hidden');$('#roomInput').value=qp.get('room').toUpperCase()}
function connect(action){if(WORKER_URL.startsWith('COLE_')){alert('Configure a URL do Cloudflare Worker em WORKER_URL.');return}role=action==='create'?'p1':'p2';room=room||randomRoom();const u=new URL(WORKER_URL);u.protocol=u.protocol==='https:'?'wss:':'ws:';u.searchParams.set('room',room);u.searchParams.set('role',role);u.searchParams.set('minutes',mins);ws=new WebSocket(u);ws.onopen=()=>{$('#startMsg').textContent='Conectado à sala '+room};ws.onmessage=e=>handle(JSON.parse(e.data));ws.onclose=()=>setStatus('Conexão encerrada');}
function randomRoom(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function send(type,data={}){if(ws?.readyState===1)ws.send(JSON.stringify({type,...data}))}
function handle(m){if(m.type==='welcome'){color=m.color||null;showGame();if(m.state)applyState(m.state);if(role==='p1')history.replaceState(null,'','?room='+room)}else if(m.type==='state')applyState(m.state);else if(m.type==='error')setStatus(m.message);}
function showGame(){$('#start').classList.add('hidden');$('#game').classList.remove('hidden');$('#roomInfo').textContent='Sala: '+room;render()}
function applyState(s){state=s;color=s.colors?.[role]||color;game.load(s.fen);lastMove=s.lastMove||null;render();updateClocks();if(s.result)setStatus(s.result);else if(!s.ready)setStatus('Aguardando o outro jogador…');else if(!s.started)setStatus(color==='w'?'Você joga de brancas — faça o primeiro lance.':'Você joga de pretas — aguardando as brancas.');else setStatus(s.turn===color?'Sua vez':'Vez do adversário')}
function orientation(){return color==='b'?'b':'w'}
function squares(){let out=[];if(orientation()==='w'){for(let r=8;r>=1;r--)for(const f of 'abcdefgh')out.push(f+r)}else{for(let r=1;r<=8;r++)for(const f of 'hgfedcba')out.push(f+r)}return out}
function render(){const b=$('#board');b.innerHTML='';for(const sq of squares()){const f=sq.charCodeAt(0)-97,r=+sq[1];const el=document.createElement('div');el.className='sq '+(((f+r)&1)?'light':'dark');if(selected===sq)el.classList.add('selected');if(lastMove&&(lastMove.from===sq||lastMove.to===sq))el.classList.add('last');const lm=legal.find(x=>x.to===sq);if(lm)el.classList.add(game.get(sq)?'capture':'legal');const p=game.get(sq);if(p){const sp=document.createElement('span');sp.className='piece '+(p.color==='w'?'whitePiece':'blackPiece');sp.textContent=glyph[p.color][p.type];el.appendChild(sp)}el.onclick=()=>clickSquare(sq);b.appendChild(el)}}
function clickSquare(sq){if(!state?.ready||state?.result||state.turn!==color)return;const p=game.get(sq);if(!selected){if(p&&p.color===color){selected=sq;legal=game.moves({square:sq,verbose:true});render()}return}const target=legal.find(m=>m.to===sq);if(target){if(target.flags.includes('p')){pendingPromotion={from:selected,to:sq};showPromotion();return}send('move',{from:selected,to:sq,promotion:'q'});selected=null;legal=[];return}if(p&&p.color===color){selected=sq;legal=game.moves({square:sq,verbose:true})}else{selected=null;legal=[]}render()}
function showPromotion(){const box=$('#promoChoices');box.innerHTML='';for(const t of ['q','r','b','n']){const b=document.createElement('button');b.className='btn';b.textContent=glyph[color][t];b.onclick=()=>{send('move',{...pendingPromotion,promotion:t});pendingPromotion=null;$('#promo').classList.add('hidden');selected=null;legal=[]};box.appendChild(b)}$('#promo').classList.remove('hidden')}
function setStatus(t){$('#status').textContent=t}
function fmt(ms){ms=Math.max(0,ms||0);const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function liveTimes(){if(!state)return{w:mins*60000,b:mins*60000};let w=state.whiteMs,b=state.blackMs;if(state.started&&!state.result&&state.turnStartedAt){const d=Date.now()-state.turnStartedAt;if(state.turn==='w')w-=d;else b-=d}return{w,b}}
function updateClocks(){const t=liveTimes();const mine=color==='w'?t.w:t.b,opp=color==='w'?t.b:t.w;$('#myClock').textContent=fmt(mine);$('#oppClock').textContent=fmt(opp);$('#me').classList.toggle('active',state?.turn===color&&!state?.result);$('#opponent').classList.toggle('active',state?.turn&&state.turn!==color&&!state?.result)}setInterval(updateClocks,200);
$('#copy').onclick=async()=>{const link=location.origin+location.pathname+'?room='+room;await navigator.clipboard.writeText(link);setStatus('Convite copiado')};$('#resign').onclick=()=>{if(confirm('Desistir da partida?'))send('resign')};
</script></main></body></html>
