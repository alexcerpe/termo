<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#1d1f22"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><title>Xadrez Online</title>
<style>
:root{--bg:#1d1f22;--panel:#292c31;--light:#e6d5b8;--dark:#8a6548;--accent:#4aa3ff;--text:#f6f7f8;--muted:#aeb4bd}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;touch-action:manipulation}body{display:flex;justify-content:center}.app{width:min(100%,620px);padding:12px 10px 22px}h1{text-align:center;margin:3px 0 10px;font-size:28px}.card{background:var(--panel);border-radius:16px;padding:18px;box-shadow:0 12px 30px #0005}.hidden{display:none!important}.start{text-align:center}.start h2{margin-top:0}.times,.actions,.footer{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:12px 18px;background:#3b4047;color:white;font-weight:800;font-size:16px;cursor:pointer}.btn.active,.btn.primary{background:var(--accent)}.btn:disabled{opacity:.45}.room{font-size:13px;color:var(--muted);margin-top:12px;word-break:break-all}.status{text-align:center;font-weight:800;margin:7px 0 9px;min-height:20px}.player{display:flex;align-items:center;justify-content:space-between;background:var(--panel);padding:9px 13px;border-radius:12px;margin:6px 0}.player.active{outline:2px solid var(--accent)}.player.offline{opacity:.58}.clock{font:900 29px/1 monospace;font-variant-numeric:tabular-nums}.board{width:100%;aspect-ratio:1/1;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));border-radius:8px;overflow:hidden;box-shadow:0 10px 30px #0007;user-select:none}.sq{display:grid;place-items:center;position:relative;min-width:0;min-height:0;aspect-ratio:1/1;font-size:clamp(30px,10vw,60px);cursor:pointer;overflow:hidden}.sq.light{background:var(--light)}.sq.dark{background:var(--dark)}.sq.selected{box-shadow:inset 0 0 0 5px #45a7ff}.sq.legal:after{content:"";width:22%;aspect-ratio:1;border-radius:50%;background:#1118;position:absolute}.sq.capture:after{content:"";position:absolute;inset:5%;border:5px solid #1117;border-radius:50%}.sq.last{box-shadow:inset 0 0 0 999px #f6e45c45}.sq.check{box-shadow:inset 0 0 0 999px #e22b2b88}.piece{z-index:2;line-height:1;display:block;max-width:100%;max-height:100%}.whitePiece{color:#fff;text-shadow:0 1px 2px #000,0 0 1px #000}.blackPiece{color:#111}.coord{position:absolute;font:bold 10px Arial;z-index:3;pointer-events:none;opacity:.75}.coord.file{right:3px;bottom:2px}.coord.rank{left:3px;top:2px}.footer{margin-top:9px}.small{font-size:13px;color:var(--muted)}.invite{margin-top:14px;padding-top:14px;border-top:1px solid #ffffff18}.qr{width:210px;height:210px;margin:10px auto;background:#fff;padding:8px;border-radius:10px}.qr img,.qr canvas{width:100%!important;height:100%!important}.code{font:900 24px monospace;letter-spacing:3px}.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:20;padding:20px}.modalBox{width:min(92vw,390px);background:var(--panel);padding:22px;border-radius:16px;text-align:center;box-shadow:0 20px 60px #0008}.modalBox h2{margin:0 0 8px}.promoChoices{display:flex;gap:8px;margin-top:12px;justify-content:center}.promoChoices button{font-size:42px;width:64px;height:64px}.tools{position:fixed;right:10px;top:10px;z-index:5}.iconbtn{border:0;border-radius:9px;background:#292c31;color:#fff;padding:8px 10px;font-size:17px}.connection{font-size:11px;color:var(--muted);text-align:center;margin-top:3px}@media(max-height:760px) and (max-width:600px){.app{padding-top:5px}h1{font-size:21px;margin:0 0 4px}.player{padding:6px 10px;margin:3px 0}.clock{font-size:24px}.status{font-size:14px;margin:4px 0}.footer{margin-top:5px}.btn{padding:9px 13px}.small{margin:5px 0}.board{width:min(100%,calc(100vh - 190px));max-width:none;max-height:none;margin:auto}}
</style></head><body><button id="sound" class="iconbtn tools" aria-label="Som">🔊</button><main class="app"><h1>XADREZ</h1>
<section id="start" class="card start"><h2>Nova partida</h2><p id="intro">Escolha o tempo e crie a sala.</p><div id="timeArea" class="times"><button class="btn time" data-min="3">3 min</button><button class="btn time active" data-min="5">5 min</button><button class="btn time" data-min="10">10 min</button></div><div id="startActions" class="actions" style="margin-top:14px"><button id="create" class="btn primary">Player 1 — Criar</button><button id="join" class="btn">Player 2 — Entrar</button></div><div id="joinBox" class="hidden" style="margin-top:12px"><input id="roomInput" placeholder="Código da sala" maxlength="8" style="padding:12px;border-radius:9px;border:0;text-transform:uppercase"><button id="joinGo" class="btn primary">Entrar</button></div><div id="startMsg" class="room"></div><div id="invite" class="invite hidden"><div>Convide o Player 2</div><div id="roomCode" class="code"></div><div id="qrcode" class="qr"></div><button id="copyStart" class="btn primary">Copiar link</button><p class="small">O Player 2 pode apontar a câmera para o QR Code.</p></div></section>
<section id="game" class="hidden"><div id="opponent" class="player"><span id="oppLabel">Adversário</span><span id="oppClock" class="clock">05:00</span></div><div id="status" class="status">Conectando…</div><div id="board" class="board"></div><div id="me" class="player"><span id="myLabel">Você</span><span id="myClock" class="clock">05:00</span></div><div class="connection" id="connection"></div><div class="footer"><button id="resign" class="btn">Desistir</button></div><p id="roomInfo" class="small" style="text-align:center"></p></section>
<div id="promo" class="modal hidden"><div class="modalBox"><b>Promover peão para:</b><div id="promoChoices" class="promoChoices"></div></div></div><div id="resultModal" class="modal hidden"><div class="modalBox"><h2 id="resultTitle">Fim de jogo</h2><p id="resultText"></p><div class="actions"><button id="rematch" class="btn primary">Jogar novamente</button><button id="newRoom" class="btn">Nova sala</button></div><p id="rematchInfo" class="small"></p></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
const WORKER_URL='https://xadrez-realtime.alex-cerpe.workers.dev',$=s=>document.querySelector(s);let mins=5,ws=null,role=null,color=null,room=null,game=new Chess(),selected=null,legal=[],lastMove=null,pendingPromotion=null,state=null,retryTimer=null,wakeLock=null,lastFen=null,soundOn=localStorage.getItem('chessSound')!=='0';
const glyph={w:{k:'♔',q:'♕',r:'♖',b:'♗',n:'♘',p:'♙'},b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}};function storageKey(){return'chess:'+room+':'+role}function getToken(){return localStorage.getItem(storageKey())||''}function setToken(t){if(t)localStorage.setItem(storageKey(),t)}
document.querySelectorAll('.time').forEach(b=>b.onclick=()=>{mins=+b.dataset.min;document.querySelectorAll('.time').forEach(x=>x.classList.toggle('active',x===b))});$('#create').onclick=()=>connect('create');$('#join').onclick=()=>$('#joinBox').classList.remove('hidden');$('#joinGo').onclick=()=>{room=$('#roomInput').value.trim().toUpperCase();if(room)connect('join')};
const qp=new URLSearchParams(location.search),invited=qp.get('room'),savedRole=qp.get('role');if(invited){room=invited.toUpperCase();if(savedRole&&getTokenFor(room,savedRole)){role=savedRole;$('#intro').textContent='Reconectando à partida '+room+'…';}else{role='p2';$('#intro').textContent='Entrando na partida '+room+'…'}$('#timeArea').classList.add('hidden');$('#startActions').classList.add('hidden');setTimeout(()=>connect(role==='p1'?'create':'join',true),100)}function getTokenFor(r,ro){return localStorage.getItem('chess:'+r+':'+ro)||''}
function inviteLink(){return location.origin+location.pathname+'?room='+room}function ownLink(){return location.origin+location.pathname+'?room='+room+'&role='+role}function showInvite(){if(role!=='p1'||state?.ready)return;$('#invite').classList.remove('hidden');$('#roomCode').textContent=room;$('#qrcode').innerHTML='';new QRCode($('#qrcode'),{text:inviteLink(),width:194,height:194,correctLevel:QRCode.CorrectLevel.M})}async function copyInvite(){try{await navigator.clipboard.writeText(inviteLink());setStatus('Convite copiado')}catch{prompt('Copie o link:',inviteLink())}}$('#copyStart').onclick=copyInvite;
function connect(action,reconnecting=false){clearTimeout(retryTimer);role=role||(action==='create'?'p1':'p2');room=room||randomRoom();const u=new URL(WORKER_URL);u.protocol='wss:';u.searchParams.set('room',room);u.searchParams.set('role',role);u.searchParams.set('minutes',mins);u.searchParams.set('token',getToken());$('#connection').textContent=reconnecting?'Reconectando…':'Conectando…';ws=new WebSocket(u);ws.onopen=()=>{$('#connection').textContent='Online';$('#startMsg').textContent='Conectado à sala '+room;if(role==='p1'&&!reconnecting){history.replaceState(null,'',ownLink());showInvite()}requestWake()};ws.onmessage=e=>handle(JSON.parse(e.data));ws.onclose=e=>{if(e.code===1008&&!state?.ready){$('#startActions').classList.remove('hidden');$('#intro').textContent=e.reason||'Não foi possível entrar nessa sala.';$('#connection').textContent=''}else{setStatus('Reconectando…');$('#connection').textContent='Offline';retryTimer=setTimeout(()=>connect(role==='p1'?'create':'join',true),1500)}};ws.onerror=()=>{$('#connection').textContent='Instável'}}function randomRoom(){return crypto.getRandomValues(new Uint32Array(1))[0].toString(36).slice(0,6).toUpperCase().padStart(6,'0')}function send(type,data={}){if(ws?.readyState===1)ws.send(JSON.stringify({type,...data}))}
function handle(m){if(m.type==='welcome'){if(m.token){setToken(m.token);history.replaceState(null,'',ownLink())}color=m.color||null;if(m.state)applyState(m.state);if(m.state?.ready)showGame();else if(role==='p1')showInvite()}else if(m.type==='state'){applyState(m.state);if(m.state.ready){$('#invite').classList.add('hidden');showGame()}}else if(m.type==='error')setStatus(m.message)}function showGame(){$('#start').classList.add('hidden');$('#game').classList.remove('hidden');$('#roomInfo').textContent='Sala: '+room;render();requestWake()}
function applyState(s){const previous=state,oldFen=lastFen;state=s;color=s.colors?.[role]||color;mins=s.minutes||mins;game.load(s.fen);lastMove=s.lastMove||null;lastFen=s.fen;if(oldFen&&oldFen!==s.fen){playTone(game.in_check()?'check':lastMove?'move':'move');if(navigator.vibrate)navigator.vibrate(game.in_check()?[35,35,55]:25)}render();updateClocks();updateLabels();if(s.result){setStatus(s.result);showResult()}else{$('#resultModal').classList.add('hidden');if(!s.ready)setStatus('Aguardando o outro jogador…');else if(!s.started)setStatus(color==='w'?'Você joga de brancas — faça o primeiro lance.':'Você joga de pretas — aguardando as brancas.');else setStatus(s.turn===color?'Sua vez':'Vez do adversário')}if(previous?.round&&s.round!==previous.round){selected=null;legal=[];playTone('start')}}
function updateLabels(){if(!color)return;$('#myLabel').textContent='Você • '+(color==='w'?'Brancas':'Pretas');$('#oppLabel').textContent='Adversário • '+(color==='w'?'Pretas':'Brancas');const oppRole=role==='p1'?'p2':'p1';$('#opponent').classList.toggle('offline',state?.ready&&!state?.connected?.[oppRole]);$('#connection').textContent=state?.ready&&!state?.connected?.[oppRole]?'Adversário desconectado — aguardando reconexão':'Online'}
function orientation(){return color==='b'?'b':'w'}function squares(){let out=[];if(orientation()==='w'){for(let r=8;r>=1;r--)for(const f of'abcdefgh')out.push(f+r)}else{for(let r=1;r<=8;r++)for(const f of'hgfedcba')out.push(f+r)}return out}function render(){const b=$('#board');b.innerHTML='';const arr=squares();let checkSq=null;if(game.in_check()){for(const sq of arr){const p=game.get(sq);if(p?.type==='k'&&p.color===game.turn()){checkSq=sq;break}}}arr.forEach((sq,i)=>{const f=sq.charCodeAt(0)-97,r=+sq[1],el=document.createElement('div');el.className='sq '+(((f+r)&1)?'light':'dark');if(selected===sq)el.classList.add('selected');if(lastMove&&(lastMove.from===sq||lastMove.to===sq))el.classList.add('last');if(checkSq===sq)el.classList.add('check');const lm=legal.find(x=>x.to===sq);if(lm)el.classList.add(game.get(sq)?'capture':'legal');const p=game.get(sq);if(p){const sp=document.createElement('span');sp.className='piece '+(p.color==='w'?'whitePiece':'blackPiece');sp.textContent=glyph[p.color][p.type];el.appendChild(sp)}const col=i%8,row=Math.floor(i/8);if(row===7){const c=document.createElement('span');c.className='coord file';c.textContent=sq[0];el.appendChild(c)}if(col===0){const c=document.createElement('span');c.className='coord rank';c.textContent=sq[1];el.appendChild(c)}el.onclick=()=>clickSquare(sq);b.appendChild(el)})}
function clickSquare(sq){if(!state?.ready||state?.result||state.turn!==color)return;const p=game.get(sq);if(!selected){if(p&&p.color===color){selected=sq;legal=game.moves({square:sq,verbose:true});render()}return}const target=legal.find(m=>m.to===sq);if(target){if(target.flags.includes('p')){pendingPromotion={from:selected,to:sq};showPromotion();return}send('move',{from:selected,to:sq,promotion:'q'});selected=null;legal=[];return}if(p&&p.color===color){selected=sq;legal=game.moves({square:sq,verbose:true})}else{selected=null;legal=[]}render()}
function showPromotion(){const box=$('#promoChoices');box.innerHTML='';for(const t of['q','r','b','n']){const b=document.createElement('button');b.className='btn';b.textContent=glyph[color][t];b.onclick=()=>{send('move',{...pendingPromotion,promotion:t});pendingPromotion=null;$('#promo').classList.add('hidden');selected=null;legal=[]};box.appendChild(b)}$('#promo').classList.remove('hidden')}function setStatus(t){$('#status').textContent=t}function fmt(ms){ms=Math.max(0,ms||0);const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function liveTimes(){if(!state)return{w:mins*60000,b:mins*60000};let w=state.whiteMs,b=state.blackMs;if(state.started&&!state.result&&state.turnStartedAt){const d=Date.now()-state.turnStartedAt;if(state.turn==='w')w-=d;else b-=d}return{w,b}}function updateClocks(){const t=liveTimes(),mine=color==='w'?t.w:t.b,opp=color==='w'?t.b:t.w;$('#myClock').textContent=fmt(mine);$('#oppClock').textContent=fmt(opp);$('#me').classList.toggle('active',state?.turn===color&&!state?.result);$('#opponent').classList.toggle('active',state?.turn&&state.turn!==color&&!state?.result);if(state?.started&&!state.result&&(t.w<=0||t.b<=0))send('sync')}setInterval(updateClocks,200);$('#resign').onclick=()=>{if(confirm('Desistir da partida?'))send('resign')};
function showResult(){const mineWon=(state.result.startsWith('Brancas')&&color==='w')||(state.result.startsWith('Pretas')&&color==='b'),draw=state.result.startsWith('Empate');$('#resultTitle').textContent=draw?'Empate':mineWon?'Vitória':'Derrota';$('#resultText').textContent=state.result;$('#rematchInfo').textContent=state.rematch?.[role]?'Aguardando o adversário aceitar…':'';$('#rematch').disabled=!!state.rematch?.[role];$('#resultModal').classList.remove('hidden');playTone(draw?'draw':mineWon?'win':'lose');releaseWake()}$('#rematch').onclick=()=>{send('rematch');$('#rematch').disabled=true;$('#rematchInfo').textContent='Aguardando o adversário aceitar…'};$('#newRoom').onclick=()=>{location.href=location.pathname};
function playTone(kind){if(!soundOn)return;try{const A=window.AudioContext||window.webkitAudioContext,a=new A(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);const freq={move:420,check:620,start:520,win:720,lose:220,draw:360}[kind]||420;o.frequency.value=freq;g.gain.setValueAtTime(.045,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.12);o.start();o.stop(a.currentTime+.13)}catch{}}function updateSound(){ $('#sound').textContent=soundOn?'🔊':'🔇'}$('#sound').onclick=()=>{soundOn=!soundOn;localStorage.setItem('chessSound',soundOn?'1':'0');updateSound()};updateSound();
async function requestWake(){if('wakeLock'in navigator&&state?.ready&&!state?.result)try{wakeLock=await navigator.wakeLock.request('screen')}catch{}}async function releaseWake(){try{await wakeLock?.release()}catch{}wakeLock=null}document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(room&&role&&(!ws||ws.readyState>1))connect(role==='p1'?'create':'join',true);requestWake()}});window.addEventListener('online',()=>{if(room&&role&&(!ws||ws.readyState>1))connect(role==='p1'?'create':'join',true)});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></main></body></html>
