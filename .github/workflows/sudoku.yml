name: Sudoku tests
on:
  pull_request:
    paths:
      - 'sudoku/**'
      - '.github/workflows/sudoku.yml'
  push:
    branches: [main]
    paths:
      - 'sudoku/**'
      - '.github/workflows/sudoku.yml'

permissions:
  contents: read

jobs:
  sudoku:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verificar JavaScript
        run: |
          node --version
          node --check sudoku/engine.js
          node --check sudoku/app.js
          node --check sudoku/sw.js
      - name: Testar gerador e unicidade
        run: node sudoku/tests/engine.test.cjs
      - name: Testar interação e conclusão
        run: node sudoku/tests/app.test.cjs
